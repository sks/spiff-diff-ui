{{- if .Values.helm_hpa_e2a61b97076d54a6b4071fc87f59491b.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.helm_hpa_e2a61b97076d54a6b4071fc87f59491b.name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: {{ .Values.helm_hpa_e2a61b97076d54a6b4071fc87f59491b.workload_kind }}
    name: {{ .Values.helm_hpa_e2a61b97076d54a6b4071fc87f59491b.workload_name }}
  minReplicas: {{ .Values.helm_hpa_e2a61b97076d54a6b4071fc87f59491b.min_replicas }}
  maxReplicas: {{ .Values.helm_hpa_e2a61b97076d54a6b4071fc87f59491b.max_replicas }}
  metrics:
    {{- if .Values.helm_hpa_e2a61b97076d54a6b4071fc87f59491b.target_cpu_utilization_percentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.helm_hpa_e2a61b97076d54a6b4071fc87f59491b.target_cpu_utilization_percentage }}
    {{- end }}
    {{- if .Values.helm_hpa_e2a61b97076d54a6b4071fc87f59491b.target_memory_utilization_percentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.helm_hpa_e2a61b97076d54a6b4071fc87f59491b.target_memory_utilization_percentage }}
    {{- end }}
{{- end }}